name: CI - Calidad de código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests + coverage
        run: pytest --cov=app --cov=models --cov=utils --cov-report=xml --cov-report=term-missing

      - name: Subir reporte de coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (lint + tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (eslint / next lint)
        run: npm run lint

      - name: Tests + coverage
        run: npm run test:coverage

      - name: Subir reporte de coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker:
    name: Docker (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir imagen backend
        run: docker build -t epic-backend:ci backend

      - name: Construir imagen frontend
        run: docker build -t epic-frontend:ci frontend

      - name: Smoke test backend
        run: |
          docker run -d --name backend -p 8000:8000 epic-backend:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs backend
          exit 1
