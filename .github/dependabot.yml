version: 2

updates:
  # --- Backend (Python / pip) ---
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # numpy 2.5+ requiere Python >= 3.12; CI y Dockerfile usan Python 3.11.
      - dependency-name: "numpy"
        versions:
          - ">=2.5"
    commit-message:
      prefix: "deps(backend)"

  # --- Frontend (Node / npm) ---
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependendendencies"
      - "frontend"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "eslint"
        versions:
          - ">=9"
      - dependency-name: "eslint-config-next"
        versions:
          - ">=15"
      - dependency-name: "react"
        versions:
          - ">=19"
      - dependency-name: "@types/react"
        versions:
          - ">=19"
      - dependency-name: "react-dom"
        versions:
          - ">=19"
      - dependency-name: "@types/react-dom"
        versions:
          - ">=19"
      - dependency-name: "next"
        versions:
          - ">=15"
    commit-message:
      prefix: "deps(frontend)"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependendencies"
      - "ci"
    commit-message:
      prefix: "deps(actions)"