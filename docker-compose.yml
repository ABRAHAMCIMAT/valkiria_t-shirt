services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Código montado sobre /app (WORKDIR de la imagen) para que --reload vea los cambios.
      - ./backend:/app
      # El venv local trae binarios del host; el contenedor usa sus propias dependencias.
      - /app/venv
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_API_URL=${LLM_API_URL:-http://host.docker.internal:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b-instruct-q4_K_M}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-300}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - epic-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # node_modules y .next del contenedor (los del host tienen binarios de macOS).
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: npm run dev
    networks:
      - epic-net
    depends_on:
      - backend

networks:
  epic-net:
    driver: bridge
